name: CI Quality Control

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 03_Taller_MVP/Proyectos/asistente-estadistica-tesis/requirements.txt

      - name: Run Environment Verification Script
        run: |
          python scripts/setup_dev_env.py

      - name: Run Flagship MVP Unit Tests
        run: |
          cd 03_Taller_MVP/Proyectos/asistente-estadistica-tesis
          python -m pytest tests/ -v

      - name: Run Flagship MVP Lint and Format Checks
        run: |
          cd 03_Taller_MVP/Proyectos/asistente-estadistica-tesis
          python -m ruff check src tests
          python -m ruff format --check src tests
